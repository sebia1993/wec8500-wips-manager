name: Cleanup release assets

on:
  push:
    branches:
      - feature/windows-protected-profile
    paths:
      - .github/workflows/cleanup-release-assets.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all manual release assets except Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.5.1-profile.4
          KEEP: WEC8500_WIPS_Manager_v1.5.1_profile.4_Win11_x64.zip
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          keep_count="$(jq -r --arg keep "${KEEP}" '[.assets[] | select(.name == $keep)] | length' <<<"${release_json}")"
          test "${keep_count}" -eq 1
          mapfile -t ids < <(jq -r --arg keep "${KEEP}" '.assets[] | select(.name != $keep) | .id' <<<"${release_json}")
          for id in "${ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done
          remaining="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.assets | length' <<<"${remaining}")" -eq 1
          test "$(jq -r '.assets[0].name' <<<"${remaining}")" = "${KEEP}"
