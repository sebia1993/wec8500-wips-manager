name: Update profile.4 release text

on:
  push:
    branches:
      - feature/windows-protected-profile
    paths:
      - .github/workflows/update-profile4-release-text.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: "442513615"
          RELEASE_BODY: |
            # WEC8500 WIPS Manager v1.5.1 — profile.4

            Windows 사용자 보호 프로필과 누적 안정화 수정이 포함된 사전 릴리즈입니다.

            - Windows 사용자 범위 DPAPI로 선택한 AP 비밀번호와 목표 WIPS 공유키를 암호화해 저장합니다.
            - AP IP·hostname 조회, 변경 전후 확인, HTML·CSV·TXT 보고서를 제공합니다.
            - AP 이름 충돌, 분할 수신, 빈 공유키 파싱, CSV 저장 오류, 프로필 저장 충돌과 종료 경합을 보완했습니다.

            ## 다운로드

            직접 첨부된 배포 파일은 아래 **1개**입니다.

            - `WEC8500_WIPS_Manager_v1.5.1_profile.4_Win11_x64.zip`

            ZIP 전체를 새 폴더에 압축 해제한 뒤 `WEC8500_WIPS_Manager_v1.5.1_profile.4_Win11_x64.exe`를 실행하세요.

            GitHub 화면에 별도로 표시되는 **Source code (zip) / Source code (tar.gz)**는 태그에서 GitHub가 자동 생성하는 항목이며, 수동 배포 첨부파일이 아닙니다.

            ## 검증 범위

            Linux/Xvfb에서 전체 회귀 테스트 424개가 통과했습니다. Windows 실행파일은 디지털 서명이 없습니다.

            Windows 실제 실행, 네이티브 DPAPI·파일 잠금·ACL 및 사내 WEC8500/AP 검증은 사용자 환경에서 별도로 확인합니다.
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f body="${RELEASE_BODY}" >/dev/null
          current="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          test "$(jq -r '.assets | length' <<<"${current}")" -eq 1
          test "$(jq -r '.assets[0].name' <<<"${current}")" = "WEC8500_WIPS_Manager_v1.5.1_profile.4_Win11_x64.zip"
          grep -Fq "직접 첨부된 배포 파일은 아래 **1개**입니다." <<<"$(jq -r '.body' <<<"${current}")"
